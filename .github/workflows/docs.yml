name: Docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: RFC quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        shell: bash
        run: >-
          rustup toolchain install 1.97.0
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Check required RFC draft
        shell: bash
        run: |
          set -euo pipefail

          test -s drafts/agent-surface.md
          test -s drafts/modules/core.md
          test -s drafts/modules/conformance.md
          grep -q '^# ASP Core' drafts/modules/core.md
          grep -q '^# ASP Conformance' drafts/modules/conformance.md

      - name: Install review dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --requirement review/requirements.txt

      - name: Install locked Hyperprompt toolchain
        timeout-minutes: 3
        shell: bash
        run: make publication-assembly-toolchain

      - name: Check specification publication contract
        timeout-minutes: 5
        shell: bash
        run: >-
          make publication-check
          PUBLICATION_BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          PUBLICATION_CANDIDATE_REF="${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Validate conformance catalog
        timeout-minutes: 5
        shell: bash
        run: make conformance-validate

      - name: Test conformance catalog
        timeout-minutes: 35
        shell: bash
        run: make conformance-test

      - name: Check mock bundle
        timeout-minutes: 5
        shell: bash
        run: make mock-check

      - name: Check independent reference vertical slice
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail

          make vertical-slice-check
          if [[ -n "$(git status --porcelain=v1)" ]]; then
            echo "The vertical-slice producer changed the checkout" >&2
            git status --short >&2
            exit 1
          fi
          printf 'ASP_VERTICAL_SLICE_VALIDATED_SHA=%s\n' "${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Check stable Rust tooling
        timeout-minutes: 12
        shell: bash
        run: make rust-tooling-check

      - name: Check RFC review data
        timeout-minutes: 5
        shell: bash
        run: make review-data-check

      - name: Check RFC review tests
        timeout-minutes: 5
        shell: bash
        run: make review-test

      - name: Check RFC table of contents
        timeout-minutes: 2
        shell: bash
        run: make rfc-toc-check

      - name: Check dashboard artifact and UI state
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          make review-js-test
          python -B review/build_review.py --check
          node review/check_review.mjs

      - name: Check repository whitespace
        shell: bash
        run: |
          set -euo pipefail
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "${empty_tree}" HEAD

      - name: Check Markdown hygiene
        shell: bash
        run: |
          set -euo pipefail

          files_found=0
          failed=0
          while IFS= read -r file; do
            files_found=1

            if grep -n $'\r' "${file}"; then
              echo "::error file=${file}::CRLF line endings are not allowed"
              failed=1
            fi

            if grep -n '[[:blank:]]$' "${file}"; then
              echo "::error file=${file}::Trailing whitespace is not allowed"
              failed=1
            fi

            if [[ -s "${file}" && -n "$(tail -c 1 "${file}")" ]]; then
              echo "::error file=${file}::File must end with a newline"
              failed=1
            fi
          done < <(git ls-files '*.md')

          if [[ "${files_found}" -eq 0 ]]; then
            echo "No Markdown files found." >&2
            exit 1
          fi

          exit "${failed}"

  markdown-links:
    name: Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # ISO serves a CAPTCHA/403 to automated clients for this valid page.
          # RFC Editor occasionally sends automated clients through a redirect
          # loop; validate the same immutable RFC number through IETF Datatracker.
          # The generated aggregate preserves module-relative navigation links;
          # validate those links in their authoritative module sources instead.
          args: >-
            --no-progress
            --accept 200,204,206,301,302,303,307,308,429
            --accept-timeouts
            --exclude-path 'drafts/agent-surface.md'
            --exclude '^https://www\.iso\.org/standard/64758\.html$'
            --remap '^https://www\.rfc-editor\.org/rfc/rfc([0-9]+)$ https://datatracker.ietf.org/doc/html/rfc$1'
            --timeout 10
            --max-retries 1
            --retry-wait-time 2
            --max-concurrency 16
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
