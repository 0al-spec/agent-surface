name: Authoritative RFC assembly

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rfc-assembly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: RFC assembly (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
            expected_os: Linux
            expected_arch: x86_64
          - runner: macos-15
            platform: macos-arm64
            expected_os: Darwin
            expected_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --requirement review/requirements.txt

      - name: Verify runner identity
        env:
          EXPECTED_OS: ${{ matrix.expected_os }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "${EXPECTED_OS}"
          test "$(uname -m)" = "${EXPECTED_ARCH}"

      - name: Install locked Hyperprompt release
        env:
          COMPILER_PATH: ${{ runner.temp }}/hyperprompt
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          python -B publication/assembly/check.py install-toolchain \
            --platform "${PLATFORM}" \
            --destination "${COMPILER_PATH}"

      - name: Verify authoritative modular aggregate
        env:
          COMPILER_PATH: ${{ runner.temp }}/hyperprompt
        shell: bash
        run: |
          set -euo pipefail
          python -B publication/modular.py check \
            --compiler "${COMPILER_PATH}"

  compare:
    name: RFC assembly cross-platform comparison
    needs: platform
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require matching authoritative platform builds
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "${PLATFORM_RESULT}" = "success"
