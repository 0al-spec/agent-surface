name: RFC assembly cross-platform

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rfc-assembly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: RFC assembly (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
            expected_os: Linux
            expected_arch: x86_64
          - runner: macos-15
            platform: macos-arm64
            expected_os: Darwin
            expected_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --requirement review/requirements.txt

      - name: Verify runner identity
        env:
          EXPECTED_OS: ${{ matrix.expected_os }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "${EXPECTED_OS}"
          test "$(uname -m)" = "${EXPECTED_ARCH}"

      - name: Install locked Hyperprompt release
        env:
          COMPILER_PATH: ${{ runner.temp }}/hyperprompt
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          python -B publication/assembly/check.py install-toolchain \
            --platform "${PLATFORM}" \
            --destination "${COMPILER_PATH}"

      - name: Build clean-checkout platform report
        env:
          COMPILER_PATH: ${{ runner.temp }}/hyperprompt
          PLATFORM: ${{ matrix.platform }}
          REPORT_PATH: ${{ runner.temp }}/rfc-assembly-${{ matrix.platform }}.json
        shell: bash
        run: |
          set -euo pipefail
          python -B publication/assembly/check.py build \
            --compiler "${COMPILER_PATH}" \
            --platform "${PLATFORM}" \
            --source-revision "${GITHUB_SHA}" \
            --report "${REPORT_PATH}"
          test -s "${REPORT_PATH}"

      - name: Upload platform report
        uses: actions/upload-artifact@v7
        with:
          name: rfc-assembly-report-${{ matrix.platform }}
          path: ${{ runner.temp }}/rfc-assembly-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30

  compare:
    name: RFC assembly cross-platform comparison
    needs: platform
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --requirement review/requirements.txt

      - name: Download platform reports
        uses: actions/download-artifact@v8
        with:
          pattern: rfc-assembly-report-*
          path: ${{ runner.temp }}/rfc-assembly-reports
          merge-multiple: true

      - name: Compare exact platform evidence
        env:
          REPORTS_PATH: ${{ runner.temp }}/rfc-assembly-reports
          OUTPUT_PATH: ${{ runner.temp }}/rfc-assembly-cross-platform.json
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "${REPORTS_PATH}" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')" = "2"
          python -B publication/assembly/check.py compare-reports \
            --source-revision "${GITHUB_SHA}" \
            --report "${REPORTS_PATH}/rfc-assembly-linux-amd64.json" \
            --report "${REPORTS_PATH}/rfc-assembly-macos-arm64.json" \
            --output "${OUTPUT_PATH}"
          test -s "${OUTPUT_PATH}"

      - name: Upload cross-platform report
        uses: actions/upload-artifact@v7
        with:
          name: rfc-assembly-cross-platform
          path: ${{ runner.temp }}/rfc-assembly-cross-platform.json
          if-no-files-found: error
          retention-days: 30
